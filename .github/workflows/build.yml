name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  remote-chunk-host-test:
    name: Remote Chunk host / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Normal
            cflags: ""
            suffix: ""
          - name: ThreadSanitizer
            cflags: "-fsanitize=thread -g"
            suffix: "-tsan"

    steps:
      - uses: actions/checkout@v4

      - name: Build and test the public interface
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread \
            -DIS_REMOTE_CHUNK_ALLOCATION_TEST \
            -Wl,--wrap=calloc \
            ${{ matrix.cflags }} \
            infiniswap_bd/is_remote_chunk.c \
            infiniswap_bd/tests/remote-chunk-test.c \
            -o "${{ runner.temp }}/remote-chunk-test${{ matrix.suffix }}"
          "${{ runner.temp }}/remote-chunk-test${{ matrix.suffix }}"

  ubuntu-build:
    name: Ubuntu ${{ matrix.ubuntu }} / Linux ${{ matrix.kernel }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            kernel: "5.15"
          - ubuntu: "24.04"
            kernel: "6.8"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            debhelper \
            dkms \
            ninja-build \
            pkg-config \
            libibverbs-dev \
            librdmacm-dev \
            libssl-dev \
            python3-jsonschema \
            linux-headers-generic

      - name: Install Noble DKMS debhelper addon
        if: matrix.ubuntu == '24.04'
        run: sudo apt-get install -y dh-dkms

      - name: Configure Memory Provider
        run: >-
          cmake -S infiniswap_daemon
          -B "${{ runner.temp }}/infiniswap-daemon"
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build Memory Provider with warnings as errors
        run: cmake --build "${{ runner.temp }}/infiniswap-daemon"

      - name: Test Memory Provider
        run: >-
          ctest --test-dir "${{ runner.temp }}/infiniswap-daemon"
          --output-on-failure

      - name: Test endian-stable protocol vectors
        if: matrix.ubuntu == '24.04'
        run: |
          sudo apt-get install -y gcc-s390x-linux-gnu qemu-user
          s390x-linux-gnu-gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -static -Icommon common/infiniswap_protocol.c \
            infiniswap_daemon/tests/protocol_test.c \
            -o "${{ runner.temp }}/protocol-test-s390x"
          qemu-s390x "${{ runner.temp }}/protocol-test-s390x"

      - name: Test configuration and status schemas
        run: |
          python3 - <<'PY'
          import json
          import jsonschema
          from pathlib import Path

          config = Path("config")
          pairs = (
              ("consumer-v1.schema.json", "consumer-v1.example.json"),
              ("consumer-v2.schema.json", "consumer-v2.example.json"),
              ("consumer.schema.json", "consumer.example.json"),
              ("consumer.schema.json", "consumer-remote-only.example.json"),
              ("provider-v1.schema.json", "provider-v1.example.json"),
              ("provider.schema.json", "provider.example.json"),
              ("kernel-abi-evidence.schema.json", "kernel-abi-evidence.example.json"),
              ("provider-directory-v1.schema.json", "provider-directory-v1.example.json"),
              ("provider-directory.schema.json", "provider-directory.example.json"),
          )
          for schema_name, example_name in pairs:
              schema = json.loads((config / schema_name).read_text())
              example = json.loads((config / example_name).read_text())
              jsonschema.Draft7Validator.check_schema(schema)
              jsonschema.validate(example, schema)

          status_pairs = (
              ("status-v1.schema.json", "status-v1.json"),
              ("status-v2.schema.json", "status-v2.json"),
              ("status-v3.schema.json", "status-v3.json"),
              ("status-v4.schema.json", "status-v4.json"),
              ("status-v5.schema.json", "status-v5.json"),
              ("status.schema.json", "status-v6.json"),
              ("provider-status.schema.json", "provider-status-v1.json"),
          )
          for schema_name, snapshot_name in status_pairs:
              schema = json.loads((config / schema_name).read_text())
              status = json.loads(
                  (Path("infiniswapctl/tests/snapshots") / snapshot_name).read_text())
              jsonschema.Draft7Validator.check_schema(schema)
              jsonschema.validate(status, schema)
          PY

      - name: Test infiniswapctl
        run: |
          python3 -m compileall -q infiniswapctl
          python3 -m unittest discover -s infiniswapctl/tests -v
          bin/infiniswapctl --help >/dev/null

      - name: Test Debian package contracts
        run: |
          python3 -m unittest discover -s tests/package -p 'test_*.py' -v
          bash -n \
            tests/package/run \
            infiniswap_bd/scripts/dkms-preflight.sh \
            infiniswap_bd/scripts/dkms-sign-module.sh

      - name: Build Debian package set
        run: |
          dpkg-buildpackage --build=binary --no-sign
          control_dir=$(mktemp -d)
          for package in infiniswap-dkms infiniswap-provider infiniswapctl; do
            artifact=$(find .. -maxdepth 1 -type f -name "${package}_*.deb" -print -quit)
            test -n "$artifact"
            dpkg-deb --info "$artifact" >/dev/null
            package_control="$control_dir/$package"
            mkdir -p "$package_control"
            dpkg-deb --control "$artifact" "$package_control"
            if grep -ERn '\b(swapon|mkswap)\b|swapoff[[:space:]]+-a' "$package_control"; then
              echo "package maintainer script mutates swap" >&2
              exit 1
            fi
          done
          dkms_artifact=$(find .. -maxdepth 1 -type f -name 'infiniswap-dkms_*.deb' -print -quit)
          dkms_root=$(mktemp -d)
          dpkg-deb --extract "$dkms_artifact" "$dkms_root"
          source_root=$(find "$dkms_root/usr/src" -mindepth 1 -maxdepth 1 \
            -type d -name 'infiniswap-*' ! -name '*#MODULE_VERSION#*' -print -quit)
          test -f "$source_root/dkms.conf"
          test -f "$source_root/infiniswap_bd/Makefile"
          ! find "$dkms_root/usr/src" -name '*#MODULE_VERSION#*' -print -quit | grep -q .

      - name: Test VM harness contracts
        run: |
          python3 -m unittest discover -s tests/vm -p 'test_*.py' -v
          python3 -m py_compile \
            tests/vm/infiniswap_vm.py \
            tests/vm/qemu_backend.py \
            tests/vm/compare_performance.py
          bash -n tests/vm/run tests/vm/compare tests/vm/guest.sh
          tests/vm/run --help >/dev/null
          tests/vm/compare --help >/dev/null

      - name: Test Memory Consumer Remote I/O Transaction ownership
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread \
            infiniswap_bd/is_remote_io_transaction.c \
            infiniswap_bd/tests/remote-io-transaction-test.c \
            -o "${{ runner.temp }}/remote-io-transaction-test"
          "${{ runner.temp }}/remote-io-transaction-test"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=thread -g \
            infiniswap_bd/is_remote_io_transaction.c \
            infiniswap_bd/tests/remote-io-transaction-test.c \
            -o "${{ runner.temp }}/remote-io-transaction-test-tsan"
          "${{ runner.temp }}/remote-io-transaction-test-tsan"

      - name: Test Memory Consumer RDMA operation ownership
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread \
            infiniswap_bd/is_rdma_operation_owner.c \
            infiniswap_bd/tests/rdma-operation-owner-test.c \
            -o "${{ runner.temp }}/rdma-operation-owner-test"
          "${{ runner.temp }}/rdma-operation-owner-test"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=thread -g \
            infiniswap_bd/is_rdma_operation_owner.c \
            infiniswap_bd/tests/rdma-operation-owner-test.c \
            -o "${{ runner.temp }}/rdma-operation-owner-test-tsan"
          "${{ runner.temp }}/rdma-operation-owner-test-tsan"

      - name: Test RDMA tuple discovery
        run: infiniswap_bd/tests/rdma-build-flags-test.sh

      - name: Check Memory Consumer helper syntax
        run: |
          bash -n infiniswap_bd/tests/local-backing-test.sh
          bash -n infiniswap_bd/tests/remote-backed-test.sh
          bash -n infiniswap_bd/tests/remote-only-test.sh
          bash -n tests/package/run
          bash -n infiniswap_bd/scripts/dkms-preflight.sh
          bash -n infiniswap_bd/scripts/dkms-sign-module.sh
          bash -n setup/infiniswap_bd_setup.sh
          bash -n setup/infiniswap_bd_teardown.sh
          bash -n setup/install.sh
          python3 -m py_compile bin/infiniswapctl

      - name: Select GA kernel headers
        id: headers
        shell: bash
        run: |
          kdir=$(find /usr/src -maxdepth 1 -type d \
            -name "linux-headers-${{ matrix.kernel }}.*-generic" \
            -print | sort -V | tail -n 1)
          test -n "$kdir"
          echo "kdir=$kdir" >> "$GITHUB_OUTPUT"

      - name: Build Memory Consumer module
        run: >-
          make -C infiniswap_bd
          KDIR="${{ steps.headers.outputs.kdir }}"
          modules

      - name: Check whitespace
        run: git diff --check
