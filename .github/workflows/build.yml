name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-build:
    name: Ubuntu ${{ matrix.ubuntu }} / Linux ${{ matrix.kernel }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "22.04"
            kernel: "5.15"
          - ubuntu: "24.04"
            kernel: "6.8"

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libibverbs-dev \
            librdmacm-dev \
            libssl-dev \
            python3-jsonschema \
            linux-headers-generic

      - name: Configure Memory Provider
        run: >-
          cmake -S infiniswap_daemon
          -B "${{ runner.temp }}/infiniswap-daemon"
          -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build Memory Provider with warnings as errors
        run: cmake --build "${{ runner.temp }}/infiniswap-daemon"

      - name: Test Memory Provider
        run: >-
          ctest --test-dir "${{ runner.temp }}/infiniswap-daemon"
          --output-on-failure

      - name: Test endian-stable protocol vectors
        if: matrix.ubuntu == '24.04'
        run: |
          sudo apt-get install -y gcc-s390x-linux-gnu qemu-user
          s390x-linux-gnu-gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -static -Icommon common/infiniswap_protocol.c \
            infiniswap_daemon/tests/protocol_test.c \
            -o "${{ runner.temp }}/protocol-test-s390x"
          qemu-s390x "${{ runner.temp }}/protocol-test-s390x"

      - name: Test configuration and status schemas
        run: |
          python3 - <<'PY'
          import json
          import jsonschema
          from pathlib import Path

          config = Path("config")
          pairs = (
              ("consumer.schema.json", "consumer.example.json"),
              ("provider.schema.json", "provider.example.json"),
              ("provider-directory.schema.json", "provider-directory.example.json"),
          )
          for schema_name, example_name in pairs:
              schema = json.loads((config / schema_name).read_text())
              example = json.loads((config / example_name).read_text())
              jsonschema.Draft7Validator.check_schema(schema)
              jsonschema.validate(example, schema)

          schema = json.loads((config / "status.schema.json").read_text())
          status = json.loads(
              Path("infiniswapctl/tests/snapshots/status-v1.json").read_text())
          jsonschema.Draft7Validator.check_schema(schema)
          jsonschema.validate(status, schema)
          PY

      - name: Test infiniswapctl
        run: |
          python3 -m compileall -q infiniswapctl
          python3 -m unittest discover -s infiniswapctl/tests -v
          bin/infiniswapctl --help >/dev/null

      - name: Test RDMA tuple discovery
        run: infiniswap_bd/tests/rdma-build-flags-test.sh

      - name: Check Memory Consumer helper syntax
        run: |
          bash -n infiniswap_bd/tests/local-backing-test.sh
          bash -n setup/infiniswap_bd_setup.sh
          bash -n setup/infiniswap_bd_teardown.sh
          bash -n setup/install.sh
          python3 -m py_compile bin/infiniswapctl

      - name: Select GA kernel headers
        id: headers
        shell: bash
        run: |
          kdir=$(find /usr/src -maxdepth 1 -type d \
            -name "linux-headers-${{ matrix.kernel }}.*-generic" \
            -print | sort -V | tail -n 1)
          test -n "$kdir"
          echo "kdir=$kdir" >> "$GITHUB_OUTPUT"

      - name: Build Memory Consumer module
        run: >-
          make -C infiniswap_bd
          KDIR="${{ steps.headers.outputs.kdir }}"
          modules

      - name: Check whitespace
        run: git diff --check
